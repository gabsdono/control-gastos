<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Gastos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --border: #e5e5ea;
    --accent: #007aff;
    --ok: #34c759;
    --warning: #ff9500;
    --over: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --border: #38383a;
      --accent: #0a84ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header.topbar {
    padding: 12px 20px;
    font-weight: 700;
    font-size: 22px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: env(safe-area-inset-top);
    background: var(--bg);
    z-index: 5;
  }
  main { padding: 12px 16px 90px; max-width: 560px; margin: 0 auto; }
  .tab { display: none; }
  .tab.active { display: block; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 16px; }
  .summary-row.total { font-weight: 700; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 10px; }
  .progress-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .progress-row:last-child { border-bottom: none; }
  .progress-head { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
  .progress-track { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; }
  .level-ok { color: var(--ok); }
  .level-warning { color: var(--warning); }
  .level-over { color: var(--over); }
  .progress-fill.level-ok { background: var(--ok); }
  .progress-fill.level-warning { background: var(--warning); }
  .progress-fill.level-over { background: var(--over); }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; font-size: 15px; }

  .segmented { display: flex; background: var(--border); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .segmented button {
    flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px;
    font-size: 14px; font-weight: 600; color: var(--text);
  }
  .segmented button.active { background: var(--card); }

  .list-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .list-row:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-main > div:first-child { font-size: 16px; }
  .row-sub { font-size: 13px; color: var(--muted); }
  .row-amount { font-variant-numeric: tabular-nums; font-size: 16px; white-space: nowrap; }
  .row-delete { border: none; background: none; color: var(--muted); font-size: 16px; padding: 4px 6px; }
  .inline-input {
    border: none; background: transparent; color: var(--muted); font-size: 13px; padding: 0;
    width: 110px; font-family: inherit;
  }
  .toggle input { width: 20px; height: 20px; }

  .fab {
    position: fixed; right: 20px; bottom: calc(70px + env(safe-area-inset-bottom));
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: var(--accent); color: white; font-size: 26px; line-height: 52px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    z-index: 6;
  }

  nav.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; background: var(--card); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 5;
  }
  nav.tabbar button {
    flex: 1; border: none; background: none; padding: 10px 4px 8px; font-size: 11px; color: var(--muted);
  }
  nav.tabbar button.active { color: var(--accent); font-weight: 600; }

  dialog {
    border: none; border-radius: 16px; padding: 0; width: min(420px, 92vw);
    background: var(--card); color: var(--text);
  }
  dialog::backdrop { background: rgba(0,0,0,0.4); }
  dialog form { padding: 20px; }
  dialog h2 { margin: 0 0 16px; font-size: 18px; }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  dialog input, dialog select {
    display: block; width: 100%; margin-top: 4px; padding: 10px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
    font-family: inherit;
  }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
  .dialog-actions button { padding: 10px 16px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-primary { background: var(--accent); color: white; }
</style>
</head>
<body>
  <header class="topbar" id="topTitle">Resumen</header>

  <main>
    <section id="tab-resumen" class="tab active">
      <div class="card">
        <h2>Este mes</h2>
        <div class="summary-row"><span>Gastos fijos</span><span id="sumFixed">$0.00</span></div>
        <div class="summary-row"><span>Gastos variables</span><span id="sumVariable">$0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal">$0.00</span></div>
      </div>
      <div class="card">
        <h2>Categorías (variable vs. límite)</h2>
        <div id="categoryProgress"></div>
      </div>
    </section>

    <section id="tab-gastos" class="tab">
      <div class="segmented">
        <button id="btnKindFixed" class="active">Fijos</button>
        <button id="btnKindVariable">Variables</button>
      </div>
      <div class="card" id="expenseList"></div>
    </section>

    <section id="tab-categorias" class="tab">
      <div class="card" id="categoryList"></div>
    </section>
  </main>

  <button class="fab" id="btnAdd" aria-label="Agregar">+</button>

  <nav class="tabbar">
    <button data-tab="resumen" class="active">Resumen</button>
    <button data-tab="gastos">Gastos</button>
    <button data-tab="categorias">Categorías</button>
  </nav>

  <dialog id="dlgFixed">
    <form id="formFixed">
      <h2>Nuevo gasto fijo</h2>
      <label>Nombre
        <input required id="fixedName" type="text" placeholder="Arriendo">
      </label>
      <label>Monto mensual
        <input required id="fixedAmount" type="number" inputmode="decimal" step="0.01" min="0">
      </label>
      <label>Categoría
        <select id="fixedCategory"><option value="">Ninguna</option></select>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-close>Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgVariable">
    <form id="formVariable">
      <h2>Nuevo gasto variable</h2>
      <label>Nombre
        <input required id="variableName" type="text" placeholder="Supermercado">
      </label>
      <label>Monto
        <input required id="variableAmount" type="number" inputmode="decimal" step="0.01" min="0">
      </label>
      <label>Fecha
        <input required id="variableDate" type="date">
      </label>
      <label>Categoría
        <select id="variableCategory"><option value="">Ninguna</option></select>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-close>Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgCategory">
    <form id="formCategory">
      <h2>Nueva categoría</h2>
      <label>Nombre
        <input required id="categoryName" type="text" placeholder="Comida">
      </label>
      <label>Límite mensual (opcional)
        <input id="categoryLimit" type="number" inputmode="decimal" step="0.01" min="0">
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-close>Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="logic.js"></script>
  <script>
    const STORAGE_KEY = 'controlGastosData';

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { categories: [], fixedExpenses: [], variableExpenses: [] };
        const parsed = JSON.parse(raw);
        return {
          categories: parsed.categories || [],
          fixedExpenses: parsed.fixedExpenses || [],
          variableExpenses: parsed.variableExpenses || []
        };
      } catch {
        return { categories: [], fixedExpenses: [], variableExpenses: [] };
      }
    }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    let state = load();
    let expenseKind = 'fixed';

    const currency = new Intl.NumberFormat('es-EC', { style: 'currency', currency: 'USD' });
    function money(n) { return currency.format(n || 0); }
    function uid() { return crypto.randomUUID(); }
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function emptyMsg(text) { return `<p class="empty">${escapeHtml(text)}</p>`; }
    function todayISO() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    function formatDate(iso) {
      return parseLocalDate(iso).toLocaleDateString('es-EC', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function thisMonthVariable() {
      const now = new Date();
      return state.variableExpenses.filter(e => isSameMonth(e.date, now));
    }
    function totalFixed() { return state.fixedExpenses.filter(e => e.active).reduce((s, e) => s + e.amount, 0); }
    function totalVariable() { return thisMonthVariable().reduce((s, e) => s + e.amount, 0); }
    function categorySpent(catId) {
      return thisMonthVariable().filter(e => e.categoryId === catId).reduce((s, e) => s + e.amount, 0);
    }

    function renderAll() { renderDashboard(); renderExpenses(); renderCategories(); }

    function renderDashboard() {
      document.getElementById('sumFixed').textContent = money(totalFixed());
      document.getElementById('sumVariable').textContent = money(totalVariable());
      document.getElementById('sumTotal').textContent = money(totalFixed() + totalVariable());

      const list = document.getElementById('categoryProgress');
      if (state.categories.length === 0) {
        list.innerHTML = emptyMsg('Todavía no hay categorías. Creá una en la pestaña Categorías.');
        return;
      }
      list.innerHTML = state.categories.map(cat => {
        const spent = categorySpent(cat.id);
        const level = budgetLevel(spent, cat.limit);
        const pct = cat.limit ? Math.min(spent / cat.limit, 1) * 100 : 0;
        return `
          <div class="progress-row">
            <div class="progress-head">
              <span>${escapeHtml(cat.name)}</span>
              <span class="level-${level}">${cat.limit ? money(spent) + ' / ' + money(cat.limit) : money(spent)}</span>
            </div>
            ${cat.limit ? `<div class="progress-track"><div class="progress-fill level-${level}" style="width:${pct}%"></div></div>` : ''}
          </div>`;
      }).join('');
    }

    function renderExpenses() {
      document.getElementById('btnKindFixed').classList.toggle('active', expenseKind === 'fixed');
      document.getElementById('btnKindVariable').classList.toggle('active', expenseKind === 'variable');
      const list = document.getElementById('expenseList');

      if (expenseKind === 'fixed') {
        if (state.fixedExpenses.length === 0) { list.innerHTML = emptyMsg('Sin gastos fijos. Agregá arriendo, suscripciones, etc.'); return; }
        list.innerHTML = state.fixedExpenses.slice().sort((a, b) => a.name.localeCompare(b.name)).map(e => {
          const cat = state.categories.find(c => c.id === e.categoryId);
          return `
            <div class="list-row">
              <label class="toggle"><input type="checkbox" ${e.active ? 'checked' : ''} data-action="toggle-fixed" data-id="${e.id}"></label>
              <div class="row-main">
                <div>${escapeHtml(e.name)}</div>
                ${cat ? `<div class="row-sub">${escapeHtml(cat.name)}</div>` : ''}
              </div>
              <div class="row-amount">${money(e.amount)}</div>
              <button class="row-delete" data-action="delete-fixed" data-id="${e.id}" aria-label="Eliminar">✕</button>
            </div>`;
        }).join('');
      } else {
        if (state.variableExpenses.length === 0) { list.innerHTML = emptyMsg('Sin gastos variables. Registrá lo que gastás día a día.'); return; }
        list.innerHTML = state.variableExpenses.slice().sort((a, b) => b.date.localeCompare(a.date)).map(e => {
          const cat = state.categories.find(c => c.id === e.categoryId);
          return `
            <div class="list-row">
              <div class="row-main">
                <div>${escapeHtml(e.name)}</div>
                <div class="row-sub">${cat ? escapeHtml(cat.name) + ' · ' : ''}${formatDate(e.date)}</div>
              </div>
              <div class="row-amount">${money(e.amount)}</div>
              <button class="row-delete" data-action="delete-variable" data-id="${e.id}" aria-label="Eliminar">✕</button>
            </div>`;
        }).join('');
      }
    }

    function renderCategories() {
      const list = document.getElementById('categoryList');
      if (state.categories.length === 0) { list.innerHTML = emptyMsg('Sin categorías. Creá una para poder ponerle un límite mensual.'); return; }
      list.innerHTML = state.categories.slice().sort((a, b) => a.name.localeCompare(b.name)).map(cat => `
        <div class="list-row">
          <div class="row-main">
            <div>${escapeHtml(cat.name)}</div>
            <div class="row-sub">
              Límite: <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="Sin límite"
                value="${cat.limit ?? ''}" data-action="edit-limit" data-id="${cat.id}" class="inline-input">
            </div>
          </div>
          <button class="row-delete" data-action="delete-category" data-id="${cat.id}" aria-label="Eliminar">✕</button>
        </div>`).join('');
    }

    // Tabs
    document.querySelectorAll('.tabbar button').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + tab));
        document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b === btn));
        document.getElementById('topTitle').textContent = { resumen: 'Resumen', gastos: 'Gastos', categorias: 'Categorías' }[tab];
      });
    });

    // Gastos: Fijos/Variables toggle
    document.getElementById('btnKindFixed').addEventListener('click', () => { expenseKind = 'fixed'; renderExpenses(); });
    document.getElementById('btnKindVariable').addEventListener('click', () => { expenseKind = 'variable'; renderExpenses(); });

    // Expense list actions (delete / toggle active)
    document.getElementById('expenseList').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const id = btn.dataset.id;
      if (btn.dataset.action === 'delete-fixed') state.fixedExpenses = state.fixedExpenses.filter(x => x.id !== id);
      if (btn.dataset.action === 'delete-variable') state.variableExpenses = state.variableExpenses.filter(x => x.id !== id);
      save(); renderAll();
    });
    document.getElementById('expenseList').addEventListener('change', e => {
      const input = e.target.closest('[data-action="toggle-fixed"]');
      if (!input) return;
      const item = state.fixedExpenses.find(x => x.id === input.dataset.id);
      if (item) { item.active = input.checked; save(); renderAll(); }
    });

    // Category list actions (delete / edit limit)
    document.getElementById('categoryList').addEventListener('click', e => {
      const btn = e.target.closest('[data-action="delete-category"]');
      if (!btn) return;
      const id = btn.dataset.id;
      state.categories = state.categories.filter(c => c.id !== id);
      state.fixedExpenses.forEach(x => { if (x.categoryId === id) x.categoryId = null; });
      state.variableExpenses.forEach(x => { if (x.categoryId === id) x.categoryId = null; });
      save(); renderAll();
    });
    document.getElementById('categoryList').addEventListener('change', e => {
      const input = e.target.closest('[data-action="edit-limit"]');
      if (!input) return;
      const cat = state.categories.find(c => c.id === input.dataset.id);
      if (cat) { cat.limit = input.value === '' ? null : parseFloat(input.value); save(); renderDashboard(); }
    });

    // Dialogs
    document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', () => btn.closest('dialog').close()));
    function populateCategorySelects() {
      ['fixedCategory', 'variableCategory'].forEach(id => {
        const sel = document.getElementById(id);
        const current = sel.value;
        sel.innerHTML = '<option value="">Ninguna</option>' +
          state.categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        sel.value = current;
      });
    }

    document.getElementById('btnAdd').addEventListener('click', () => {
      const activeTab = document.querySelector('.tab.active').id;
      if (activeTab === 'tab-gastos') {
        populateCategorySelects();
        if (expenseKind === 'fixed') {
          document.getElementById('dlgFixed').showModal();
        } else {
          document.getElementById('variableDate').value = todayISO();
          document.getElementById('dlgVariable').showModal();
        }
      } else if (activeTab === 'tab-categorias') {
        document.getElementById('dlgCategory').showModal();
      } else {
        document.querySelector('.tabbar button[data-tab="gastos"]').click();
      }
    });

    document.getElementById('formFixed').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('fixedName').value.trim();
      const amount = parseFloat(document.getElementById('fixedAmount').value);
      if (!name || isNaN(amount)) return;
      const categoryId = document.getElementById('fixedCategory').value || null;
      state.fixedExpenses.push({ id: uid(), name, amount, active: true, categoryId });
      save();
      e.target.reset();
      document.getElementById('dlgFixed').close();
      renderAll();
    });

    document.getElementById('formVariable').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('variableName').value.trim();
      const amount = parseFloat(document.getElementById('variableAmount').value);
      const date = document.getElementById('variableDate').value;
      if (!name || isNaN(amount) || !date) return;
      const categoryId = document.getElementById('variableCategory').value || null;
      state.variableExpenses.push({ id: uid(), name, amount, date, categoryId });
      save();
      e.target.reset();
      document.getElementById('dlgVariable').close();
      renderAll();
    });

    document.getElementById('formCategory').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('categoryName').value.trim();
      if (!name) return;
      const limitRaw = document.getElementById('categoryLimit').value;
      const limit = limitRaw === '' ? null : parseFloat(limitRaw);
      state.categories.push({ id: uid(), name, limit });
      save();
      e.target.reset();
      document.getElementById('dlgCategory').close();
      renderAll();
    });

    renderAll();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
